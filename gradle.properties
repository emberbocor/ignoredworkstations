org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# ForgeGradle: put classes and resources of the Forge module in one directory, required by Forge 1.21.1 dev runs.
net.minecraftforge.gradle.merge-source-sets=true

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Vanilla Minecraft (NeoForm) used to compile the common module. See https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
neo_version=21.1.265
# The lowest NeoForge version the mod declares support for.
# Verify with: ./gradlew :neoforge:compileJava "-Pneo_version=21.1.1"
neo_version_range=[21.1.1,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

# Fabric. The jar is compiled against minecraft_version and declares fabric_minecraft_version_range. Fabric API is not needed.
# Check each boundary with the minimum loader: ./gradlew :fabric:compileJava "-Pminecraft_version=1.21" "-Pfabric_loader_version=0.15.11"
# ./gradlew :fabric:compileJava "-Pminecraft_version=1.21.1" "-Pfabric_loader_version=0.15.11"
fabric_loader_version=0.20.1
fabric_loader_version_range=>=0.15.11
fabric_minecraft_version_range=>=1.21 <=1.21.1
fabric_minecraft_label=1.21-1.21.1

# Forge. Verify the minimum with: ./gradlew :forge:compileJava "-Pforge_version=52.0.0"
# forge_minecraft_version is separate from minecraft_version so the Fabric 1.21 check does not change the Forge module.
forge_minecraft_version=1.21.1
forge_version=52.1.21
forge_version_range=[52.0.0,)
forge_loader_version_range=[52,)

mod_id=ignoredworkstations
mod_name=Ignored Workstations
mod_license=MIT
mod_version=1.0.0
mod_group_id=io.github.emberbocor.ignoredworkstations
